<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>잭바팀 | 티어 케어 서비스</title>

<style>
body{
    margin:0;
    font-family:"Malgun Gothic", sans-serif;
    background:#0f0f0f;
    color:#fff;
}

/* 헤더 */
.header{
    background:linear-gradient(90deg,#ff2d2d,#ff6a00);
    padding:20px;
    text-align:center;
    font-size:2rem;
    font-weight:bold;
}

/* 컨테이너 */
.container{
    max-width:900px;
    margin:40px auto;
    padding:20px;
    text-align:center;
}

/* 배너 */
.banner{
    background:#1a1a1a;
    padding:25px;
    border-radius:12px;
    margin-bottom:20px;
}

/* 추천인 박스 */
.ref-box{
    margin-top:20px;
    background:#151515;
    padding:20px;
    border-radius:10px;
    border:1px solid #2a2a2a;
}

input{
    width:70%;
    padding:12px;
    border-radius:8px;
    border:none;
    outline:none;
    font-size:1rem;
}

button{
    background:linear-gradient(90deg,#ff2d2d,#ff6a00);
    border:none;
    padding:12px 20px;
    margin-left:10px;
    color:white;
    font-weight:bold;
    border-radius:8px;
    cursor:pointer;
}

button:hover{
    transform:scale(1.05);
}
</style>
</head>

<body>

<div class="header">
    J A C K B A T E A M
</div>

<div class="container">

    <div class="banner">
        <h2>트롤 / 탈주 때문에 망한 티어 복구</h2>
        <p>속도 · 안정성 · 승률 기반 관리 시스템</p>
    </div>

    <!-- 추천인 입력 -->
    <div class="ref-box">
        <h3>추천인 코드 입력</h3>
        <input type="text" id="refCode" placeholder="추천인 코드를 입력하세요">
        <button onclick="checkCode()">확인하기</button>
    </div>

</div>

<script>
function checkCode(){
    const code = document.getElementById("refCode").value;

    if(code.trim() === ""){
        alert("추천인 코드를 입력하세요");
        return;
    }

    const popup = window.open("", "_blank", "width=400,height=250");

    if(!popup){
        alert("팝업 차단됨");
        return;
    }

    popup.document.write(`
        <html>
        <head>
            <style>
                body{
                    margin:0;
                    background:#111;
                    color:white;
                    display:flex;
                    justify-content:center;
                    align-items:center;
                    height:100vh;
                    font-size:2rem;
                    font-family:sans-serif;
                }
            </style>
        </head>
        <body>
            구라야 ㅋ
        </body>
        </html>
    `);
}
</script>

</body>
</html>
