<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>잭바팀</title>

<style>
body{
    margin:0;
    background:#111;
    color:white;
    font-family:"Malgun Gothic",sans-serif;
}

.container{
    max-width:900px;
    margin:50px auto;
    padding:20px;
    text-align:center;
}

h1{
    color:#ff4444;
    font-size:3rem;
}

.content{
    font-size:1.5rem;
    line-height:1.8;
}

.buttons{
    margin-top:40px;
}

button{
    background:#ff4444;
    color:white;
    border:none;
    padding:15px 30px;
    font-size:1.1rem;
    border-radius:8px;
    cursor:pointer;
}

button:hover{
    background:#ff6666;
}
</style>
</head>

<body>

<div class="container">

    <h1>잭바팀</h1>

    <div class="content">
        @@ 트롤/탈주에 막힌 내 티어, 심폐소생술 해드립니다 @@
        <br><br>

        속도/능률/퀄리티 NO.1 ‘잭바팀’
        <br><br>

        판수 채우기용 무의미한 판치기는 가라!
        <br>
        깔끔한 연승 행진으로 증명합니다.
        <br><br>

        추천인 king 적고 30% 할인 혜택까지 야무지게 챙기세요!
    </div>

    <div class="buttons">
        <button onclick="showPrice()">가격 문의하기</button>
    </div>

</div>

<script>
function showPrice() {
    const popup = window.open("", "_blank", "width=400,height=250");

    popup.document.write(`
        <!DOCTYPE html>
        <html>
        <head>
            <title>가격 안내</title>
            <style>
                body{
                    background:#111;
                    color:white;
                    display:flex;
                    justify-content:center;
                    align-items:center;
                    height:100vh;
                    margin:0;
                    font-size:2rem;
                    font-family:sans-serif;
                }
            </style>
        </head>
        <body>
            구라야 ㅋ
        </body>
        </html>
    `);
}
</script>

</body>
</html>
