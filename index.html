<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>잭바팀 | 티어 케어 서비스</title>

<style>
body{
    margin:0;
    font-family:"Malgun Gothic", sans-serif;
    background:#0f0f0f; 
    color:#fff;
}

/* 상단 */
.header{
    background:linear-gradient(90deg,#ff2d2d,#ff6a00);
    padding:20px;
    text-align:center;
    font-size:2rem;
    font-weight:bold;
    letter-spacing:2px;
}

/* 메인 */
.container{
    max-width:900px;
    margin:40px auto;
    padding:20px;
}

/* 배너 */
.banner{
    background:#1a1a1a;
    padding:25px;
    border-radius:12px;
    text-align:center;
    box-shadow:0 0 20px rgba(255,0,0,0.2);
}

.banner h2{
    color:#ff4b4b;
    margin-bottom:10px;
}

.banner p{
    color:#ccc;
    line-height:1.6;
}

/* 카드 */
.cards{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:15px;
    margin-top:25px;
}

.card{
    background:#181818;
    padding:15px;
    border-radius:10px;
    text-align:center;
    border:1px solid #2a2a2a;
}

.card h3{
    color:#ff4b4b;
}

/* 추천인 입력창 */
.ref-box{
    margin-top:25px;
    text-align:center;
}

.ref-box input{
    padding:10px;
    width:250px;
    border-radius:8px;
    border:none;
    margin-right:10px;
}

/* 버튼 */
.btn{
    margin-top:30px;
    text-align:center;
}

button{
    background:linear-gradient(90deg,#ff2d2d,#ff6a00);
    border:none;
    padding:15px 40px;
    font-size:1.2rem;
    color:white;
    border-radius:10px;
    cursor:pointer;
    font-weight:bold;
    box-shadow:0 5px 15px rgba(255,0,0,0.3);
}

button:hover{
    transform:scale(1.05);
}

/* 후기 */
.review{
    margin-top:30px;
    background:#151515;
    padding:20px;
    border-radius:10px;
    border-left:4px solid #ff4b4b;
    color:#ccc;
}
</style>
</head>

<body>

<div class="header">
    J A C K B A T E A M
</div>

<div class="container">

    <div class="banner">
        <h2>트롤 / 탈주 때문에 망한 티어, 복구 가능합니다</h2>
        <p>
            속도 · 안정성 · 승률 집중 관리 서비스<br>
            “판수만 채우는 작업은 하지 않습니다”
        </p>
    </div>

    <div class="cards">
        <div class="card">
            <h3>빠른 작업</h3>
            <p>평균 24시간 내 티어 상승</p>
        </div>

        <div class="card">
            <h3>고승률 유지</h3>
            <p>연승 중심 운영 시스템</p>
        </div>

        <div class="card">
            <h3>비밀 보장</h3>
            <p>모든 기록 완전 익명 처리</p>
        </div>
    </div>

    <!-- 추천인 코드 입력창 -->
    <div class="ref-box">
        <input type="text" id="refCode" placeholder="추천인 코드 입력">
        <button onclick="checkRefCode()">확인</button>
    </div>

    <div class="review">
        ⭐ 후기: "진짜 스트레스 없이 올라갔습니다" - KING 
        ⭐ 후기: "트롤만 만나서 포기했는데 복구됨" - 아무닉이나해야지
    </div>

    <div class="btn">
        <button onclick="openPopup()">가격 문의하기</button>
    </div>

</div>

<script>
function checkRefCode(){
    const code = document.getElementById("refCode").value;
    if(!code.trim()){
        alert("추천인 코드를 입력해주세요");
        return;
    }
    alert("입력 확인: 구라야 ㅋ");
}

function openPopup(){
    const popup = window.open("", "_blank", "width=400,height=250");

    if(!popup){
        alert("팝업 차단됨");
        return;
    }

    popup.document.write(`
        <html>
        <head>
            <style>
                body{
                    margin:0;
                    background:#111;
                    color:white;
                    display:flex;
                    justify-content:center;
                    align-items:center;
                    height:100vh;
                    font-size:2rem;
                    font-family:sans-serif;
                }
            </style>
        </head>
        <body>
            구라야 ㅋ
        </body>
        </html>
    `);
}
</script>

</body>
</html>
