<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JACKBATEAM</title>

<style>
body{
    margin:0;
    background:#0b0b0b;
    color:white;
    font-family:sans-serif;
}

/* 상단 */
.header{
    background:linear-gradient(90deg,#ff0033,#ff7a00);
    padding:18px;
    text-align:center;
    font-weight:bold;
    letter-spacing:3px;
}

/* 컨테이너 */
.container{
    max-width:900px;
    margin:40px auto;
    padding:20px;
}

/* 박스 */
.box{
    background:#151515;
    padding:20px;
    border-radius:12px;
    margin-bottom:15px;
    border:1px solid #2a2a2a;
}

/* 강조 */
.badge{
    display:inline-block;
    background:#ff2d2d;
    padding:5px 10px;
    border-radius:6px;
    font-size:12px;
}

/* 입력 */
input{
    width:70%;
    padding:12px;
    border:none;
    border-radius:8px;
}

/* 버튼 */
button{
    padding:12px 18px;
    border:none;
    background:linear-gradient(90deg,#ff2d2d,#ff7a00);
    color:white;
    font-weight:bold;
    border-radius:8px;
    cursor:pointer;
}

button:hover{
    transform:scale(1.05);
}

/* 로딩 */
#loading{
    display:none;
    text-align:center;
    margin-top:20px;
    color:#ffcc00;
}

/* 스피너 */
.spinner{
    width:40px;
    height:40px;
    border:4px solid #333;
    border-top:4px solid #ff4d4d;
    border-radius:50%;
    margin:10px auto;
    animation:spin 1s linear infinite;
}

@keyframes spin{
    0%{transform:rotate(0deg);}
    100%{transform:rotate(360deg);}
}
</style>
</head>

<body>

<div class="header">
    JACK BATEAM SYSTEM v3.0
</div>

<div class="container">

    <div class="box">
        <span class="badge">HOT</span>
        <h2>승률 기반 자동 티어 복구 시스템</h2>
        <p>AI 분석으로 매칭 회피 + 연승 구조 최적화</p>
    </div>

    <div class="box">
        <h3>추천인 코드 입력</h3>
        <input id="code" placeholder="EX: KING, VIP, PRO">
        <button onclick="startProcess()">확인</button>
    </div>

    <div id="loading">
        <div class="spinner"></div>
        <p>시스템 분석 중... (승률 계산 중)</p>
    </div>

</div>

<script>
function startProcess(){
    const code = document.getElementById("code").value;

    if(code.trim() === ""){
        alert("코드를 입력하세요");
        return;
    }

    document.getElementById("loading").style.display = "block";

    setTimeout(() => {
        showResult();
    }, 2500);
}

function showResult(){
    const popup = window.open("", "_blank", "width=420,height=260");

    if(!popup){
        alert("팝업 차단됨");
        return;
    }

    popup.document.write(`
        <html>
        <head>
        <style>
            body{
                margin:0;
                background:#111;
                color:white;
                display:flex;
                justify-content:center;
                align-items:center;
                height:100vh;
                font-size:2rem;
                font-family:sans-serif;
            }
        </style>
        </head>
        <body>
            구라야 ㅋ
        </body>
        </html>
    `);
}
</script>

</body>
</html>
